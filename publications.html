<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Publications</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
    }
    h2, h3 {
      color: #2c3e50;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin-bottom: 1rem;
    }
    .year {
      margin-top: 2rem;
    }
    a {
      text-decoration: none;
      color: #2980b9;
    }
  </style>
</head>
<body>
  <h2>Publications</h2>
  <div id="publications-container"></div>

  <script type="module">
    import bibtexParse from 'https://cdn.jsdelivr.net/npm/bibtex-parse-js@1.0.12/+esm';

    async function loadPublications() {
      const response = await fetch('publications.bib');
      const bibtexText = await response.text();
      const entries = bibtexParse.toJSON(bibtexText);

      const container = document.getElementById('publications-container');
      const byYear = {};

      entries.forEach(entry => {
        const year = entry.entryTags.year || 'Unknown';
        if (!byYear[year]) byYear[year] = [];
        byYear[year].push(entry);
      });

      const sortedYears = Object.keys(byYear).sort((a, b) => b - a);
      sortedYears.forEach(year => {
        const h3 = document.createElement('h3');
        h3.textContent = year;
        h3.className = 'year';
        container.appendChild(h3);

        const ul = document.createElement('ul');
        byYear[year].forEach(entry => {
          const li = document.createElement('li');
          const authors = entry.entryTags.author;
          const title = entry.entryTags.title;
          const journal = entry.entryTags.journal || entry.entryTags.booktitle;
          const doi = entry.entryTags.doi ? `<a href="https://doi.org/${entry.entryTags.doi}" target="_blank">${title}</a>` : title;
          const note = entry.entryTags.note ? ` (${entry.entryTags.note})` : '';

          li.innerHTML = `${doi}, <i>${journal}</i> (${year}). ${authors}${note}`;
          ul.appendChild(li);
        });

        container.appendChild(ul);
      });
    }

    loadPublications();
  </script>
</body>
</html>
